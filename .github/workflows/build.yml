name: Build

# Binaries cannot be cross-compiled, so each one is built on the system it is for.
# Run by hand to check that a change still builds everywhere; run by a tag to make
# the release. `RELEASING.md` is the same procedure written out for a person.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # A tag is what names the release, and `src/rederive/__init__.py` is what names
  # the version everything else is built from, so a release where the two disagree
  # is caught here rather than after three platforms have finished building. Run by
  # hand there is no tag and nothing to disagree with, so the check passes.
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/rederive/__init__.py)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version; expected v$version"
            exit 1
          fi

  build:
    needs: version
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # The suite and two builds. A build is most of a gigabyte of Qt to analyse and
    # write out twice over, so this is quarter-hour work rather than five-minute
    # work now. Forty is a hang.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            exe: ""
          - platform: macos-arm64
            os: macos-15
            exe: ""
          - platform: windows-x86_64
            os: windows-2025
            exe: ".exe"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # A bundle carries the shared libraries the build machine had, and warns
      # rather than fails about the ones it did not. Qt 6.5 and later load
      # `libxcb-cursor.so.0` from the xcb platform plugin, which is the plugin every
      # X11 desktop uses, and a runner without it builds a Linux binary that opens no
      # plot window at all - "could not load the Qt platform plugin xcb", on a machine
      # where nothing is wrong. Nothing here reaches that code path, so the missing
      # library would first be heard about from whoever downloaded the release.
      #
      # The build warns about `libtiff.so.5` for the same reason and it is left
      # alone: the distribution ships libtiff 6 now, and all it costs is Qt's TIFF
      # image plugin, which nothing reaches - a plot exports as PNG or SVG.
      - name: Install what Qt loads by name
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0

      # `--managed-python` so that all three platforms build on uv's own
      # interpreter rather than on whatever the runner happens to have lying
      # about: a runner with a Python of its own would otherwise be built
      # against, and nothing downstream would say so. `.python-version` says
      # which interpreter, and "Check what the binaries carry" is what holds
      # the finished bundles to it.
      - name: Install dependencies
        run: uv sync --frozen --managed-python --group packaging

      # A release must not be cut from code that fails its own tests, so this
      # runs before anything is built rather than beside it.
      # `faulthandler_timeout` dumps every thread's stack when one test overruns
      # and then ends the process, so a hang says where it was rather than
      # leaving the job to be killed by the clock with nothing to read.
      - name: Run the suite
        run: |
          uv run pytest -q -o faulthandler_timeout=120 \
              -o faulthandler_exit_on_timeout=true

      - name: Build the single file
        run: uv run --group packaging pyinstaller packaging/rederive.spec --noconfirm

      - name: Build the directory form
        run: |
          uv run --group packaging pyinstaller packaging/rederive.spec --noconfirm \
              --distpath dist/tree -- --tree

      - name: Check both
        run: |
          uv run python packaging/smoke.py "dist/rederive${{ matrix.exe }}"
          uv run python packaging/smoke.py "dist/tree/rederive/rederive${{ matrix.exe }}"

      # A bundle brings its own interpreter, its own sympy and its own Qt, and from
      # outside it there is no way to tell which. So each one is asked, and the answer
      # is held against the two files that decide it. What this catches is a build made
      # against something other than what the suite ran on: the program still starts,
      # still computes, still passes every other check here, and is not the program
      # that was tested. Only the interpreter's minor version is compared, that being
      # all `.python-version` pins, and only Qt's, because what the lock file pins is
      # the PySide6 wheel and the Qt inside it carries a patch number of its own.
      - name: Check what the binaries carry
        run: |
          version_of() {
            sed -n "/^name = \"$1\"\$/{n;s/^version = \"\(.*\)\"\$/\1/p;}" uv.lock
          }
          expected_python=$(cat .python-version)
          expected_sympy=$(version_of sympy)
          expected_qt=$(version_of pyside6-essentials | cut -d. -f1,2)
          expected_pyqtgraph=$(version_of pyqtgraph)
          for binary in "dist/rederive${{ matrix.exe }}" \
                        "dist/tree/rederive/rederive${{ matrix.exe }}"; do
            reported=$("$binary" --version)
            python=$(echo "$reported" | awk '$1 == "Python" { print $2 }')
            sympy=$(echo "$reported" | awk '$1 == "sympy" { print $2 }')
            qt=$(echo "$reported" | awk '$1 == "Qt" { print $2 }')
            pyqtgraph=$(echo "$reported" | awk '$1 == "pyqtgraph" { print $2 }')
            echo "$binary: Python $python, sympy $sympy, Qt $qt, pyqtgraph $pyqtgraph"
            case "$python" in
              "$expected_python".* | "$expected_python") ;;
              *) echo "expected Python $expected_python.x, not $python"; exit 1 ;;
            esac
            case "$qt" in
              "$expected_qt".* | "$expected_qt") ;;
              *) echo "expected Qt $expected_qt.x, not $qt"; exit 1 ;;
            esac
            if [ "$sympy" != "$expected_sympy" ]; then
              echo "expected sympy $expected_sympy, not $sympy"
              exit 1
            fi
            if [ "$pyqtgraph" != "$expected_pyqtgraph" ]; then
              echo "expected pyqtgraph $expected_pyqtgraph, not $pyqtgraph"
              exit 1
            fi
          done

      - name: Package the archive
        if: runner.os != 'Windows'
        run: tar -C dist/tree -czf "dist/rederive-${{ matrix.platform }}.tar.gz" rederive

      - name: Package the archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\tree\rederive `
              -DestinationPath dist\rederive-windows-x86_64.zip

      - name: Check install.sh
        if: runner.os != 'Windows'
        run: |
          sh packaging/install.sh --archive "dist/rederive-${{ matrix.platform }}.tar.gz" \
              --prefix "$RUNNER_TEMP/share" --bin "$RUNNER_TEMP/bin"
          uv run python packaging/smoke.py "$RUNNER_TEMP/bin/rederive"
          sh packaging/install.sh --uninstall --prefix "$RUNNER_TEMP/share" \
              --bin "$RUNNER_TEMP/bin"
          test ! -e "$RUNNER_TEMP/share/rederive"

      # The installer is compiled, run, checked and taken away again, which is the
      # only way to find out whether it installs what it says it installs.
      - name: Build and check the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The program under test exits 2 on purpose, and this step's shell would
          # otherwise read a native command's exit code as an error of its own and
          # end the step where nothing is wrong. Every check below says what it is
          # about to do, so a failure names itself rather than leaving an exit code
          # to be guessed at.
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false

          function Check($what, $ok) {
            if ($ok) { Write-Host "  ok   $what" } else { Write-Host "  FAIL $what"; exit 1 }
          }
          function CurrentPath() {
            $entry = Get-ItemProperty -Path HKCU:\Environment -Name Path `
                -ErrorAction SilentlyContinue
            if ($entry) { return $entry.Path } else { return "" }
          }

          choco install innosetup --no-progress -y | Out-Null
          $version = "0.0.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF -replace "refs/tags/v", ""
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" packaging\rederive.iss | Out-Null
          Check "compiles" ($LASTEXITCODE -eq 0)

          Start-Process -Wait -FilePath dist\rederive-setup.exe `
              -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
          $installed = "$env:LOCALAPPDATA\Programs\Rederive\rederive.exe"
          Check "installs" (Test-Path $installed)

          & $installed no-such-worksheet.mth
          Check "the installed program runs" ($LASTEXITCODE -eq 2)
          Check "PATH gained the directory" ((CurrentPath) -like "*Rederive*")

          $uninstaller = Get-ChildItem "$env:LOCALAPPDATA\Programs\Rederive\unins*.exe" |
              Select-Object -First 1
          Check "the uninstaller is there" ($null -ne $uninstaller)
          Start-Process -Wait -FilePath $uninstaller.FullName -ArgumentList "/VERYSILENT"
          Check "uninstalling removes the program" (-not (Test-Path $installed))
          Check "uninstalling removes the PATH entry" ((CurrentPath) -notlike "*Rederive*")
          exit 0

      - name: Name the artifacts
        run: |
          mv "dist/rederive${{ matrix.exe }}" \
             "dist/rederive-${{ matrix.platform }}${{ matrix.exe }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/rederive-*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect what the release carries
        run: |
          cp packaging/install.sh artifacts/
          cd artifacts && sha256sum rederive-* install.sh > SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes
