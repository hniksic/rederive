name: Web demo

# The browser demo, built and then actually opened. `test.yml` runs the suite on
# three operating systems and says nothing about the page: everything the port
# added lives between Pyodide, a Textual driver and xterm.js, and none of it is
# reachable from pytest. So this builds the directory and asks a real browser one
# question - author an expression, simplify it, read the answer off the screen -
# which is the shortest path that goes through every piece.
#
# Publishing is a release and nothing else: a tag republishes the page, so that
# the link README points at is the latest release running. Otherwise it happens
# only when someone asks for it by hand. See the `publish` job.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built demo to GitHub Pages
        type: boolean
        default: false

# A second push supersedes the first, as in the suite: there is nothing to learn
# from finishing a run of code that has already been replaced. A run that may
# publish is exempt, a tag and a hand-started publish both being things that
# happen once and are meant to finish.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish }}

jobs:
  smoke:
    name: Build and open the demo
    runs-on: ubuntu-24.04
    # The build fetches Pyodide, npm and the wheels, and then two browsers boot a
    # Python interpreter each. Ten minutes is the ordinary run; anything past
    # thirty is a hang rather than a slow day.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # npm is what the terminal and the two plotting libraries are vendored
      # with. Nothing is fetched from it at run time - the built directory names
      # no host but its own.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Without the dev group: what the build reads out of the environment is the
      # version of Textual and the pure-Python wheels under it, so that the page
      # runs what the suite ran against. Qt is no part of that and is 200 MB.
      - name: Install dependencies
        run: uv sync --frozen --managed-python --no-dev

      - name: Build the demo
        run: python3 tools/build_web.py

      # Playwright is a correctness gate here and nothing else. Its Firefox runs
      # WebAssembly several times slower than a real one, which is why no timing
      # is taken through it and why the waits in the smoke test are generous.
      - name: Install the browsers
        run: uv run --with playwright playwright install --with-deps chromium firefox

      - name: Open the demo in Chromium and Firefox
        run: uv run --with playwright python tools/smoke_web.py --shots build/shots

      # The screen either browser was looking at, kept whether the run passed or
      # failed: a demo that broke is a picture worth having, and one that worked
      # is worth comparing the next one against.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: build/shots
          if-no-files-found: ignore

  # Publishing is a tag, or someone opening this workflow from the Actions tab,
  # ticking the box and starting it. Never a push to a branch, never a pull
  # request, and never a consequence of the smoke test passing on its own: the
  # gate runs first and a demo that a browser could not open is not published,
  # but passing it is not what decides to put a demo in front of people.
  #
  # Between releases the page therefore sits at the last tag while master moves
  # on, which is what makes the README link mean the release it claims to be.
  publish:
    name: Publish to GitHub Pages
    needs: smoke
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deploy at a time across every run of this workflow, and none of them
    # cancelled: a tag and a hand-started publish that meet queue rather than
    # race, and neither is stopped halfway through writing a site.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: uv sync --frozen --managed-python --no-dev

      # Built again rather than carried over from the smoke job, so that what is
      # published is a directory this job made out of this commit and nothing
      # else. It is four minutes and it removes a whole class of question.
      - name: Build the demo
        run: python3 tools/build_web.py

      - uses: actions/configure-pages@v5

      # Pages serves this compressed, which is the difference between 24 MB and
      # 64 MB on a first visit. It sets no COOP or COEP headers and needs to set
      # none: there is no `SharedArrayBuffer` here, so nothing on the page asks
      # for cross-origin isolation.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
