name: Test

# The suite, on every system a release is built for. Building a binary says
# nothing about whether the program is right, and until this ran the only thing
# testing Rederive was whoever last typed `uv run pytest`.
# A branch is often somewhere to experiment or to keep a copy safe, and neither is
# worth three operating systems. What a pull request builds is the merge result,
# which is the thing worth knowing about; a branch nobody has proposed yet can be
# asked about by hand.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; there is nothing to learn from finishing a
# run of code that has already been replaced.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The suite takes about two minutes. Anything past ten is a hang, and a hang
    # left alone runs into GitHub's six-hour ceiling rather than telling anyone.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    # Windows would otherwise run these in PowerShell, where a trailing
    # backslash is an argument rather than a line continuation.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # The 3D window imports `pyqtgraph.opengl`, which pulls in Qt's OpenGL module,
      # which loads `libEGL.so.1` by name. A runner without it fails that import, and
      # what fails with it is every Qt test here: the plot host will not start and
      # `--version` reports no Qt. Nothing in the suite draws on a screen - the
      # windows are offscreen - but the import has to work for any of it to be asked.
      - name: Install what Qt loads by name
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Install dependencies
        run: uv sync --frozen --managed-python

      # `faulthandler_timeout` dumps every thread's stack when one test overruns
      # and then ends the process, so a hang says where it was rather than
      # leaving the job to be killed by the clock with nothing to read.
      - name: Run the suite
        run: |
          uv run pytest -q -o faulthandler_timeout=120 \
              -o faulthandler_exit_on_timeout=true
