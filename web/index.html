<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rederive</title>
<link rel="stylesheet" href="xterm/xterm.css">
<link rel="stylesheet" href="uplot/uPlot.min.css">
<style>
  /* The terminal is the page, and the plot panes float over it. The black
     behind both is what shows through while the first frame is composed. */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #screen {
    width: 100vw;
    height: 100vh;
  }
  /* xterm draws its own scrollbar for the buffer it keeps; a full-screen
     program has no scrollback and wants none of it. */
  .xterm-viewport { overflow: hidden !important; }

  /* The two gestures a tab has that a terminal cannot ask for: opening a file,
     which a browser only ever does on a click, and making a link out of the
     address. They sit in a corner and stay faded until pointed at, since the
     program owns the screen and these are the page around it. */
  #chrome {
    position: fixed;
    top: 6px;
    right: 10px;
    z-index: 20;
    display: flex;
    gap: 6px;
    opacity: 0.28;
    transition: opacity 0.15s;
    font: 12px "DejaVu Sans", "Liberation Sans", system-ui, sans-serif;
  }
  #chrome:hover, #chrome:focus-within { opacity: 1; }
  #chrome button {
    padding: 3px 10px;
    background: rgba(17, 17, 23, 0.9);
    border: 1px solid #2b2b34;
    border-radius: 4px;
    color: #b6bcc7;
    cursor: pointer;
    font: inherit;
  }
  #chrome button:hover { color: #dde3ec; border-color: rgba(101, 178, 241, 0.55); }
  /* A finger is not a pointer: on a touch screen nothing is ever hovered, so
     the controls stand at full strength rather than waiting to be pointed at. */
  @media (hover: none) {
    #chrome { opacity: 1; }
    #chrome button { padding: 8px 14px; }
  }
  /* The demonstrations on offer, under the button that offers them. Inside
     `#chrome` so that a pointer on the menu is a pointer on the controls and
     none of it fades while it is being read. */
  #gallery {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 6px;
    min-width: 15em;
    display: flex;
    flex-direction: column;
    padding: 4px;
    background: rgba(17, 17, 23, 0.97);
    border: 1px solid #2b2b34;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
  }
  #gallery[hidden] { display: none; }
  .gallery-heading {
    padding: 6px 8px 3px;
    color: #6f7684;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  #chrome .gallery-item {
    padding: 4px 8px;
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    text-align: left;
  }
  #chrome .gallery-item:hover {
    background: rgba(101, 178, 241, 0.14);
    border-color: transparent;
    color: #dde3ec;
  }
  @media (hover: none) {
    #chrome .gallery-item { padding: 8px; }
  }
  /* What the page says for itself, about the things that happen beside the
     program rather than inside it. The message line belongs to Rederive. */
  #notice {
    position: fixed;
    top: 38px;
    right: 10px;
    z-index: 20;
    max-width: min(46ch, 80vw);
    padding: 6px 10px;
    background: rgba(17, 17, 23, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 6px;
    color: #dde3ec;
    font: 12px "DejaVu Sans", "Liberation Sans", system-ui, sans-serif;
    line-height: 1.35;
  }

  /* The plot panes are the desktop's plot windows, in the one place a page has
     for a window: a layer over everything, which lets the pointer through
     wherever there is no pane so that the terminal underneath still hears it. */
  #panes {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  .plot-pane {
    position: absolute;
    /* A stacking context of its own, so that what floats inside a pane - the
       legend, the writing on a box, the chip - floats inside that pane and not
       over the pane in front of it. Without it a positioned child is painted in
       the page's own stacking order, where it outranks every pane raised later. */
    z-index: 0;
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    min-width: 320px;
    min-height: 240px;
    background: #131318;
    border: 1px solid #23232b;
    border-radius: 8px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    overflow: hidden;
    resize: both;
    font: 12px "DejaVu Sans", "Liberation Sans", system-ui, sans-serif;
    color: #b6bcc7;
  }
  .plot-pane:focus { outline: none; }
  .plot-pane.current { border-color: rgba(101, 178, 241, 0.55); }
  .plot-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px 5px 10px;
    background: #131318;
    border-bottom: 1px solid #23232b;
    cursor: move;
    user-select: none;
    /* A finger dragging the bar is moving the pane and not scrolling the page.
       Without this the browser takes the gesture for itself and the pane never
       hears the moves; the picture under it says the same to uPlot's overlay. */
    touch-action: none;
  }
  .plot-title { flex: 1; color: #dde3ec; white-space: nowrap; overflow: hidden; }
  .plot-close {
    background: transparent;
    border: 1px solid #2b2b34;
    border-radius: 11px;
    color: #b6bcc7;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 2px 9px;
  }
  .plot-close:hover { color: #e2a1a1; border-color: #7c3f42; }
  .plot-canvas { position: relative; flex: 1; background: #0c0c10; overflow: hidden; }
  /* The card a solid is drawn on fills the canvas area under it; three.js sizes
     the element itself, and this is what stops a stale size from stretching it. */
  .plot-card { display: block; width: 100% !important; height: 100% !important; }
  /* The second row of a pane: the buttons `plot/controls.py` gives a word to,
     and in a 3D pane the domain and the grid in front of them. A toggle stands
     here rather than on a menu when its state is worth reading without opening
     anything. */
  .plot-tools {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 8px;
    background: #131318;
    border-bottom: 1px solid #23232b;
    user-select: none;
  }
  .plot-label { color: #8d93a0; }
  .plot-field {
    width: 52px;
    padding: 2px 4px;
    background: #0c0c10;
    border: 1px solid #2b2b34;
    border-radius: 3px;
    color: #dde3ec;
    font: inherit;
  }
  .plot-field:focus { outline: none; border-color: rgba(101, 178, 241, 0.55); }
  .plot-toggle {
    margin-left: 4px;
    padding: 2px 9px;
    background: transparent;
    border: 1px solid #2b2b34;
    border-radius: 3px;
    color: #b6bcc7;
    cursor: pointer;
    font: inherit;
  }
  .plot-toggle:hover { color: #dde3ec; border-color: #3a3a46; }
  .plot-toggle.on { color: #cfe6fb; border-color: rgba(101, 178, 241, 0.55); }
  .plot-toggle.primary { color: #cfe6fb; border-color: rgba(101, 178, 241, 0.55); }
  /* Where one answer of a strip of fields ends and the next begins. A domain in
     x, a domain in y and a grid are three answers, not six numbers in a row. */
  .plot-divider {
    width: 1px;
    align-self: stretch;
    margin: 0 4px;
    background: #2b2b34;
  }
  /* A dialog, as a page has one: an overlay over the pane that raised it, which
     takes the keyboard while it is up and hands it back when it goes. What it
     asks for is `plot/forms.py`'s, the same description the desktop draws as a
     QDialog, so the two ask for the same things in the same words. */
  .plot-form {
    position: absolute;
    inset: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(6, 6, 9, 0.55);
  }
  .plot-sheet {
    min-width: 240px;
    padding: 12px 14px;
    background: #16161c;
    border: 1px solid #2b2b34;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }
  .plot-form-head { margin-bottom: 10px; }
  .plot-form-title { color: #dde3ec; font-weight: 600; }
  .plot-form-sub { color: #7d8595; }
  .plot-group { margin-bottom: 10px; }
  .plot-group-title { margin-bottom: 5px; color: #8d93a0; }
  .plot-grid { display: grid; gap: 6px 8px; align-items: center; }
  .plot-entry { display: flex; align-items: center; gap: 6px; }
  .plot-answers { display: flex; justify-content: flex-end; gap: 6px; }
  /* The writing on a 3D box: the number at each tick and the name of each axis,
     laid over the card and projected onto it by `plot3d.js`. DOM rather than a
     font baked onto the card, so a number is drawn at the screen's own
     resolution and costs a projected point rather than a texture. The layer
     lets the pointer through everywhere, the camera being the mouse's. */
  .plot-marks {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
  }
  .plot-mark {
    position: absolute;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    color: #d0d0d0;
  }
  .plot-mark.name { color: #dde3ec; }
  .plot-status {
    padding: 4px 10px;
    min-height: 17px;
    background: #101015;
    border-top: 1px solid #1f1f27;
    color: #8d93a0;
    white-space: pre;
    overflow: hidden;
  }
  /* The legend is a floating card rather than a column beside the picture: the
     picture is the subject, and the list of what is in it is a note on top.

     The top left corner, which is where `Window2D._place_legend` puts the
     desktop's card. Which corner it is is presentation and has no shared
     spelling - a stylesheet is not something `plot/` can write - so the two are
     kept in step by hand, and a change here is a change there. Both panes wear
     this class, so a solid box and a flat picture agree by construction; a flat
     pane moves the card further in by the width of the numbers down its left
     edge, which only its own layout knows. */
  .plot-legend {
    position: absolute;
    left: 10px;
    top: 8px;
    z-index: 3;
    padding: 5px 8px;
    background: rgba(17, 17, 23, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 9px;
    max-width: 60%;
  }
  .plot-row {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    line-height: 19px;
  }
  .plot-row:hover { background: rgba(255, 255, 255, 0.07); }
  .plot-swatch { width: 18px; height: 2px; flex: none; }
  .plot-chip {
    position: absolute;
    z-index: 4;
    pointer-events: none;
    padding: 2px 6px;
    background: rgba(17, 17, 23, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 4px;
    white-space: pre;
  }
  .plot-band {
    position: absolute;
    z-index: 4;
    pointer-events: none;
    border: 1px solid rgba(101, 178, 241, 0.75);
    background: rgba(101, 178, 241, 0.14);
  }
  .plot-menu {
    position: absolute;
    z-index: 5;
    min-width: 150px;
    padding: 4px 0;
    background: rgba(17, 17, 23, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 6px;
  }
  /* One line of a menu: the tick, the words, and the key that does the same
     thing with no menu open. The last column is what makes the menu the place
     the keyboard is learned, and what stands in it is the page's own spelling
     of the binding, which `plot/controls.py` writes beside the desktop's. */
  .plot-item {
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 3px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .plot-item:hover { background: rgba(101, 178, 241, 0.22); color: #cfe6fb; }
  /* Where one group of the menu ends and the next begins, which is a property
     of the description rather than of anything here. */
  .plot-item.ruled {
    margin-top: 4px;
    padding-top: 6px;
    border-top: 1px solid #2b2b34;
  }
  .plot-item.off { color: #5c606b; cursor: default; }
  .plot-item.off:hover { background: transparent; color: #5c606b; }
  .plot-tick { flex: none; width: 9px; }
  .plot-text { flex: 1; }
  .plot-keys { color: #7d8595; }
  /* A submenu stands beside the entry it hangs off and opens under the
     pointer, which needs no state and so cannot be left open. */
  .plot-deeper { display: none; left: 100%; top: -5px; }
  .plot-item:hover > .plot-deeper { display: block; }
  /* uPlot draws the axes and their numbers and nothing else; the strokes are
     drawn on its canvas by `plot2d.js`, so its own series never show. */
  .uplot, .u-wrap { background: #0c0c10; }
  /* The overlay uPlot lays over the picture is where a pan, a pinch and the
     trace are heard, all three of them gestures the browser would otherwise
     take for a scroll. */
  .u-over { touch-action: none; }
</style>
</head>
<body>
<div id="screen"></div>
<div id="panes"></div>
<div id="chrome">
  <button id="demo" type="button" aria-haspopup="true" aria-expanded="false"
          title="Run one of the original Derive's own demonstrations">
    Demos
  </button>
  <button id="pick" type="button" title="Bring a worksheet into this page">
    Open file
  </button>
  <button id="link" type="button" title="Put this worksheet in the address">
    Link
  </button>
  <!-- Filled from the list in `demos.js`, which is the only place the
       demonstrations are named. -->
  <div id="gallery" hidden></div>
</div>
<!-- A file picker opens on a click and on nothing a program can do, which is
     why the input is here rather than made when it is wanted. `.mth` and its
     neighbours are what the Transfer commands read; anything else can still be
     chosen, since a worksheet is plain text whatever it is called. -->
<input id="picker" type="file" accept=".mth,.dmo,.dat,.ini,text/plain" multiple hidden>
<div id="notice" hidden></div>
<!-- The UMD builds, which is what xterm ships for a plain script tag: each
     leaves one global behind, and `main.js` is the only thing that reads
     them. Everything here is served from beside this file - the build names no
     other host, so it works offline and behind a proxy. -->
<script src="xterm/xterm.js"></script>
<script src="xterm/addon-fit.js"></script>
<script src="xterm/addon-unicode11.js"></script>
<script src="xterm/addon-webgl.js"></script>
<script src="xterm/addon-canvas.js"></script>
<script src="uplot/uPlot.iife.min.js"></script>
<!-- three.js is a module and its controls import it by name, which is what an
     import map is for: one entry, pointing at the copy beside this file. The
     alternative is patching a vendored file on the way in, and a build that
     edits what it vendors is a build nobody can check against upstream. -->
<script type="importmap">
{ "imports": { "three": "./three/three.module.min.js" } }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
