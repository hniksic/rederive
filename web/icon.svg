<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pythagoras as the classroom wall poster: a right triangle carrying the squares on
       its three sides. The proportions are an exact 3-4-5 (legs 13.5 and 18, hypotenuse
       22.5) and the hypotenuse square stands on the true perpendicular rather than
       being eyeballed. The blue and gold are the page's own accent colors. -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#202531"
        stroke="#323848" stroke-width="1.5"/>
  <polygon points="23,25.25 41,38.75 54.5,20.75 36.5,7.25" fill="#65b2f1"
           stroke="#101828" stroke-width="1.2"/>
  <rect x="9.5" y="25.25" width="13.5" height="13.5" fill="#d96d5a"
        stroke="#101828" stroke-width="1.2"/>
  <rect x="23" y="38.75" width="18" height="18" fill="#e8b45a"
        stroke="#101828" stroke-width="1.2"/>
  <polygon points="23,25.25 23,38.75 41,38.75" fill="#f4e3c0"
           stroke="#101828" stroke-width="1.2"/>
</svg>
