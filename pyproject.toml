[project]
name = "rederive"
version = "0.1.0"
description = "A modern remake of the DOS-era Derive computer algebra system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.86",
    "sympy>=1.14",
    "psutil>=7",
]

[project.scripts]
rederive = "rederive.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rederive"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-xdist>=3.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Simplify over the whole corpus - every shipped utility file, parser case and
# demo script - takes two minutes where the rest of the suite takes five
# seconds, so it is opt-in: `uv run pytest -m slow` runs it. Only run it after
# changing the engine, which is the only thing it can catch a regression in;
# a change to the UI or the session cannot move it. Both run across every
# core; `-n0` turns that off, which a single failing test is easier to read
# under.
addopts = "-n auto -m 'not slow'"
markers = ["slow: Simplify over the whole corpus; run with -m slow"]
