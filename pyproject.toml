[project]
name = "rederive"
version = "0.1.0"
description = "A modern remake of the DOS-era Derive computer algebra system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=0.86", "sympy>=1.14"]

[project.scripts]
rederive = "rederive.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rederive"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
