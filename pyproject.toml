[project]
name = "rederive"
dynamic = ["version"]
description = "A modern remake of the DOS-era Derive computer algebra system"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The screen, the mathematics and the arrays a curve is sampled into: what the
# program cannot be without, and all of it pure Python or a wheel that is built
# for every machine there is. Everything that needs a desktop underneath it is
# an extra below, which is what lets the package be installed somewhere that
# has no desktop - a container, a server, a browser.
dependencies = [
    "textual>=0.86",
    "sympy>=1.14",
    "numpy>=1.26",
]

# Opt-in, so `pip install rederive` is the slim install and `rederive[full]` is
# the whole program. Nearly everyone comes in through the released binary,
# which bundles everything either way; the cost of the split lands on installs
# from source, which is why `INSTALL.md` names the extras.
[project.optional-dependencies]
# What a plot window is drawn with. Essentials rather than the `pyside6`
# meta-package, which drags in `pyside6-addons` - a third of a gigabyte of
# Qt3D, Charts, WebEngine and DataVisualization that a plot window never
# touches. Without these the Plot command refuses in a sentence and nothing
# else changes.
plot = [
    "pyside6-essentials>=6.7",
    "pyqtgraph>=0.13.7",
    "pyopengl>=3.1",
]
# What the program asks the machine it is on: the resident set behind the
# memory gauge and the engine's cap, and the desktop's own clipboard. Without
# these the gauge is empty and a copy takes the terminal's road alone.
desktop = [
    "psutil>=7",
    "pyperclip>=1.9",
]
# The whole program, for an install that wants it without naming the parts.
full = ["rederive[plot,desktop]"]

[project.scripts]
rederive = "rederive.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rederive"]

# The version lives in the package, where the running program can read it out of
# itself; the build reads it from there rather than the two being kept in step by
# hand.
[tool.hatch.version]
path = "src/rederive/__init__.py"

[dependency-groups]
# The environment anyone working on this program gets, extras and all. The
# suite draws plot windows, reads a resident set and hands text to a clipboard,
# so a development environment without the extras would run a smaller suite
# than the program is answerable to - `uv run pytest` has to be the whole of
# it. Naming the package's own extra here is what makes `uv sync` and `uv run`
# install them without anyone having to remember a flag.
dev = ["rederive[full]", "pytest>=8.0", "pytest-asyncio>=0.24", "pytest-xdist>=3.6"]
# What builds the standalone executable, in a group of its own so that the
# ordinary environment does not carry it. `packaging/rederive.spec` says how.
packaging = ["pyinstaller>=6.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One run is the whole suite: `uv run pytest`. Simplify over the whole corpus
# is the heaviest thing in it and used to sit behind a marker, but the only
# change it can catch a regression in is a change to the engine, and anyone
# making one runs it - so what the marker bought was a green run that had not
# asked the question. Across every core the two together are three quarters of
# a minute; `-n0` turns the cores off, which a single failing test is easier to
# read under.
#
# Work stealing rather than the default share-out, because the cost of a case
# here spans five orders of magnitude: dealing the tests out up front leaves
# one worker on the hypergeometric integrals while the rest go idle, and a
# worker that runs dry takes work back off the stragglers instead of waiting.
addopts = "-n auto --dist worksteal"
